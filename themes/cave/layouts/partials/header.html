<a class="skip" href="#contenido">Saltar al contenido</a>
<header class="site-header">
  <a class="brand" href="{{ "/" | relURL }}">
    <img class="avatar" src="{{ site.Params.avatar | relURL }}" alt="" width="96" height="96">
    <span class="brand-text">
      <span class="site-title">{{ site.Title }}</span>
      <span class="site-subtitle">{{ site.Params.subtitle }}</span>
    </span>
  </a>
  <div class="header-tools">
    <form class="search" role="search" data-site="{{ site.BaseURL }}">
      <label for="q-top">Buscar</label>
      <input id="q-top" name="q" type="search" placeholder="buscar en este sitio">
    </form>
    <button type="button" class="theme-toggle" aria-label="Cambiar tema">
      <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
      <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <span class="theme-label">Modo claro</span>
    </button>
  </div>
</header>
